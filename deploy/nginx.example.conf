# Nginx 配置示例（HTTP，自行接入 SSL/证书）
# 复制本片段进 nginx 的 sites-available/，根据实际域名修改

server {
    listen 80;
    server_name firmware.your-domain.com;  # ← 改成你的域名

    # 前端静态文件（执行 pnpm build 后产出在 frontend/dist）
    root /var/www/releasehub/frontend;
    index index.html;

    # 上传大小上限（应 >= backend .env 中的 MAX_UPLOAD_BYTES）
    client_max_body_size 20m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 Node 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # X-Accel-Redirect 内部位置：固件文件物理目录
    # backend .env 中需设置 XACCEL_REDIRECT_PREFIX=/internal-firmware
    location /internal-firmware/ {
        internal;
        alias /var/lib/releasehub/storage/firmware/;
        # 让 Nginx 直接 sendfile，速度最快
        sendfile on;
        tcp_nopush on;
        # 大文件下载时关闭压缩
        gzip off;
    }
}
