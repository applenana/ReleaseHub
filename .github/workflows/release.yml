name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---------- Backend ----------
      - name: Install backend deps (含 devDeps 以便 tsc 构建)
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Prune backend to production deps (含 native 二进制)
        working-directory: backend
        run: npm prune --omit=dev

      # ---------- Frontend ----------
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------- Package（任何 push 都产出部署包） ----------
      - name: Compute package name
        id: pkg
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME}"
          else
            NAME="${GITHUB_REF_NAME//\//-}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "package name: $NAME"

      - name: Assemble release directory
        run: |
          set -e
          RELEASE_DIR=release
          mkdir -p "$RELEASE_DIR/backend" "$RELEASE_DIR/public"

          # backend：编译产物 + 生产依赖 + 运行清单 + 环境模板
          # node_modules 一并打包，服务器无需再 npm ci
          cp -r backend/dist                "$RELEASE_DIR/backend/dist"
          cp -r backend/node_modules        "$RELEASE_DIR/backend/node_modules"
          cp    backend/package.json        "$RELEASE_DIR/backend/package.json"
          cp    backend/package-lock.json   "$RELEASE_DIR/backend/package-lock.json"
          cp    backend/.env.example        "$RELEASE_DIR/backend/.env.example"

          # frontend：静态资源（Nginx 直接吃）
          # 用 tar pipe 保证 assets/ 下所有文件（含 hash 命名的 .js / .css）都进 public/
          if [ ! -d frontend/dist ]; then
            echo "::error::frontend/dist 不存在，构建失败"; exit 1
          fi
          ( cd frontend/dist && tar cf - . ) | ( cd "$RELEASE_DIR/public" && tar xf - )

          # 诊断：列出 public/ 与 public/assets/ 内容，确认 chunk 都到位
          echo "===== public/ 顶层 ====="
          ls -la "$RELEASE_DIR/public"
          echo "===== public/assets/ 文件数 ====="
          find "$RELEASE_DIR/public/assets" -type f | wc -l
          du -sh "$RELEASE_DIR/public"

          # 部署辅助文件
          [ -f deploy/nginx.example.conf ] && cp deploy/nginx.example.conf "$RELEASE_DIR/" || true
          [ -f README.md ]   && cp README.md   "$RELEASE_DIR/" || true
          [ -f LICENSE ]     && cp LICENSE     "$RELEASE_DIR/" || true

          # 打包
          PKG="releasehub-${{ steps.pkg.outputs.name }}"
          tar -czf "${PKG}.tar.gz" -C . release
          (cd release && zip -qr "../${PKG}.zip" .)
          ls -lah releasehub-*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasehub-${{ steps.pkg.outputs.name }}
          path: |
            releasehub-*.tar.gz
            releasehub-*.zip
          retention-days: 14

      # ---------- 发布 GitHub Release（仅 tag） ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            ### 📦 部署速记（已含 node_modules，免编译）
            ```bash
            tar xzf releasehub-${{ github.ref_name }}.tar.gz
            cd release/backend
            cp .env.example .env && vim .env   # 生成 SESSION_SECRET: openssl rand -hex 32
            node dist/src/index.js             # 直接启动，无需 npm ci
            ```
            将 `release/public/` 配为 Nginx `root`，`release/backend/` 作为后端服务。

            > ⚠️ 运行环境要求：**Linux x64 + Node 24.x**（与构建环境一致）。
            > 若服务器是其他架构/glibc 不兼容，请用源码自行 `npm ci && npm run build`。
          files: |
            releasehub-${{ steps.pkg.outputs.name }}.tar.gz
            releasehub-${{ steps.pkg.outputs.name }}.zip
          draft: false
          prerelease: false
