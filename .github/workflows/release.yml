name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---------- Backend ----------
      - name: Install backend deps (含 devDeps 以便 tsc 构建)
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ---------- Frontend ----------
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------- Package（任何 push 都产出部署包） ----------
      - name: Compute package name
        id: pkg
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME}"
          else
            NAME="${GITHUB_REF_NAME//\//-}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "package name: $NAME"

      - name: Assemble release directory
        run: |
          set -e
          RELEASE_DIR=release
          mkdir -p "$RELEASE_DIR/backend" "$RELEASE_DIR/public"

          # backend：仅编译产物 + 清单 + 环境模板
          # **不**打包 node_modules —— 由 install.sh 在目标服务器执行 npm ci --omit=dev，
          # 避免不同发行版/glibc/架构下原生模块（better-sqlite3、argon2）不兼容
          cp -r backend/dist                "$RELEASE_DIR/backend/dist"
          cp    backend/package.json        "$RELEASE_DIR/backend/package.json"
          cp    backend/package-lock.json   "$RELEASE_DIR/backend/package-lock.json"
          cp    backend/.env.example        "$RELEASE_DIR/backend/.env.example"

          # frontend：静态资源（Nginx 直接吃）
          # 用 tar pipe 保证 assets/ 下所有文件（含 hash 命名的 .js / .css）都进 public/
          if [ ! -d frontend/dist ]; then
            echo "::error::frontend/dist 不存在，构建失败"; exit 1
          fi
          ( cd frontend/dist && tar cf - . ) | ( cd "$RELEASE_DIR/public" && tar xf - )

          # 诊断：列出 public/ 与 public/assets/ 内容，确认 chunk 都到位
          echo "===== public/ 顶层 ====="
          ls -la "$RELEASE_DIR/public"
          echo "===== public/assets/ 文件数 ====="
          find "$RELEASE_DIR/public/assets" -type f | wc -l
          du -sh "$RELEASE_DIR/public"

          # 部署辅助：一键安装脚本 + Nginx 示例 + 文档
          cp deploy/install.sh "$RELEASE_DIR/install.sh"
          chmod +x "$RELEASE_DIR/install.sh"
          [ -f deploy/nginx.example.conf ] && cp deploy/nginx.example.conf "$RELEASE_DIR/" || true
          [ -f README.md ]   && cp README.md   "$RELEASE_DIR/" || true
          [ -f LICENSE ]     && cp LICENSE     "$RELEASE_DIR/" || true

          # 打包
          PKG="releasehub-${{ steps.pkg.outputs.name }}"
          tar -czf "${PKG}.tar.gz" -C . release
          (cd release && zip -qr "../${PKG}.zip" .)
          ls -lah releasehub-*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasehub-${{ steps.pkg.outputs.name }}
          path: |
            releasehub-*.tar.gz
            releasehub-*.zip
          retention-days: 14

      # ---------- 发布 GitHub Release（仅 tag） ----------
      - name: Delete existing release (force-refresh body & assets)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id') or '')")
          if [ -n "$REL_ID" ]; then
            echo "Deleting existing release id=$REL_ID for tag=$TAG"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$REL_ID"
          else
            echo "No existing release for $TAG, skip delete"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            ### 📦 一键安装部署

            ```bash
            tar xzf releasehub-${{ github.ref_name }}.tar.gz
            cd release
            chmod +x install.sh

            ./install.sh                 # 安装后端生产依赖 + 生成 .env
            ./install.sh --systemd       # 安装并写入 systemd 服务（需 sudo）
            ./install.sh --pm2           # 安装并用 pm2 启动
            ./install.sh --start         # 前台启动（调试用）
            ```

            脚本会执行 `npm ci --omit=dev` 在目标机器上现场装依赖（含 better-sqlite3 / argon2 等原生模块），
            自动生成随机 `SESSION_SECRET`。Nginx 把 root 指向 `release/public/`，参考同目录 `nginx.example.conf`。

            > 要求：**Node 20+（推荐 24.x）+ Linux/macOS**。原生依赖在目标机现编，跨发行版/架构无碍。
          files: |
            releasehub-${{ steps.pkg.outputs.name }}.tar.gz
            releasehub-${{ steps.pkg.outputs.name }}.zip
          draft: false
          prerelease: false
